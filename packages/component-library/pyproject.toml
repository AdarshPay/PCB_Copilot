[project]
name = "pcb-ai-component-library"
version = "0.1.0"
description = "Curated component profiles for high-precision rules"
requires-python = ">=3.12"
dependencies = [
  "pcb-ai-circuit-ir",
  "pydantic>=2.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
