description = "Evidence documents, facts, and citations"
requires-python = ">=3.12"
dependencies = [
  "pcb-ai-circuit-ir",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
