[project]
name = "pcb-ai-agent"
version = "0.1.0"
description = "LLM planner prompts and structured tool interfaces"
requires-python = ">=3.12"
dependencies = [
  "pcb-ai-circuit-ir",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
