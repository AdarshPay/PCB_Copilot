[project]
name = "pcb-ai-kicad-adapter"
version = "0.1.0"
description = "KiCad S-expression parse, normalize, and compile adapter"
requires-python = ">=3.12"
dependencies = [
  "pcb-ai-circuit-ir",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
