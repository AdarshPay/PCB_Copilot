[project]
name = "pcb-ai-pcb-ir"
version = "0.1.0"
description = "Typed board / PCB intermediate representation for Phase B layout"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "pcb-ai-circuit-ir",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
