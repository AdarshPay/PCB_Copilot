[project]
name = "pcb-ai-benchmarks"
version = "0.1.0"
description = "Benchmark datasets, mutation engine, and scoring"
requires-python = ">=3.12"
dependencies = [
  "pcb-ai-circuit-ir",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
