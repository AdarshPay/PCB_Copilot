[project]
name = "pcb-ai-api"
version = "0.1.0"
description = "FastAPI review service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.9",
  "pcb-ai-circuit-ir",
  "pcb-ai-kicad-adapter",
  "pcb-ai-verification",
  "pcb-ai-transactions",
  "pcb-ai-agent",
  "pcb-ai-evidence",
  "pcb-ai-layout",
  "pcb-ai-pcb-ir",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
