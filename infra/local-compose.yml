services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pcb-ai-postgres
    environment:
      POSTGRES_USER: pcb
      POSTGRES_PASSWORD: pcb
      POSTGRES_DB: pcb_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcb -d pcb_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pcb-ai-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: pcb-ai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pcbai
      MINIO_ROOT_PASSWORD: pcbai-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: pcb-ai-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 pcbai pcbai-secret;
      mc mb -p local/pcb-ai || true;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
